<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Comparison Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens ────────────────────────────────────────────── */
    :root {
      --bg:          #0d0f14;
      --surface:     #161921;
      --surface2:    #1e2230;
      --border:      #2a2f3e;
      --left-accent: #22d3a0;
      --right-accent:#ff5f57;
      --neutral:     #8b93a8;
      --text:        #e8eaf0;
      --text-dim:    #6b7280;
      --font-mono:   'Space Mono', monospace;
      --font-sans:   'DM Sans', sans-serif;
      --radius:      10px;
      --gap:         14px;
    }

    /* ── Reset / base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ─────────────────────────────────────────────────── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #topbar h1 {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    #topbar h1 span { color: var(--text); }
    .presenter-label {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ── Main layout ─────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
      min-height: 0;
    }

    /* ── Pane row ────────────────────────────────────────────────── */
    #pane-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      min-height: 0;
    }

    /* ── Individual pane ─────────────────────────────────────────── */
    .pane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pane.streaming.left  { border-color: var(--left-accent);  box-shadow: 0 0 0 1px var(--left-accent)22; }
    .pane.streaming.right { border-color: var(--right-accent); box-shadow: 0 0 0 1px var(--right-accent)22; }

    /* ── Pane header (title row + controls row) ───────────────────── */
    .pane-header {
      padding: 9px 13px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pane-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .pane-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .left  .pane-dot { background: var(--left-accent); }
    .right .pane-dot { background: var(--right-accent); }

    .pane-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .left  .pane-label { color: var(--left-accent); }
    .right .pane-label { color: var(--right-accent); }

    /* controls row: model select + condition select side by side */
    .pane-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .select-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .select-group-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .config-select-wrap {
      position: relative;
    }
    .config-select {
      appearance: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 11px;
      padding: 4px 20px 4px 7px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
    }
    .config-select:hover, .config-select:focus {
      border-color: var(--neutral);
      color: var(--text);
    }
    .config-select-wrap::after {
      content: "▾";
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* ── Condition description strip ─────────────────────────────── */
    .pane-desc {
      padding: 4px 13px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      min-height: 22px;
    }

    /* ── Response area ───────────────────────────────────────────── */
    .pane-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 0;
    }
    .response-text {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .placeholder {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 40px;
      user-select: none;
    }

    /* thinking indicator */
    .thinking {
      display: none;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--neutral);
      padding: 15px;
    }
    .thinking.visible { display: flex; }
    .thinking-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--neutral);
      margin: 0 2px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }

    /* ── Preset prompt chips ─────────────────────────────────────── */
    #chips-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }
    .chip-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 4px 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
    }
    .chip:hover { background: var(--border); border-color: var(--neutral); color: var(--text); }

    /* ── Footer / prompt input ───────────────────────────────────── */
    #footer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px;
      display: flex;
      gap: 9px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #prompt-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 9px 11px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      transition: border-color 0.15s;
    }
    #prompt-input::placeholder { color: var(--text-dim); }
    #prompt-input:focus { border-color: var(--neutral); }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #send-btn  { background: var(--text); color: var(--bg); }
    #send-btn:hover:not(:disabled) { opacity: 0.88; }
    #clear-btn { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
    #clear-btn:hover:not(:disabled) { color: var(--text); border-color: var(--neutral); }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neutral); }
  </style>
</head>
<body>

<div id="topbar">
  <h1>AI Comparison <span>Demo</span></h1>
  <span class="presenter-label">presenter controls ↓</span>
</div>

<div id="main">

  <div id="pane-row">

    <!-- Left pane -->
    <div class="pane left" id="pane-left">
      <div class="pane-header">
        <div class="pane-title-row">
          <div class="pane-dot"></div>
          <span class="pane-label" id="label-left">AI A</span>
        </div>
        <div class="pane-controls">
          <div class="select-group">
            <span class="select-group-label">Model</span>
            <div class="config-select-wrap">
              <select class="config-select" id="model-select-left" aria-label="Left pane model"></select>
            </div>
          </div>
          <div class="select-group">
            <span class="select-group-label">Condition</span>
            <div class="config-select-wrap">
              <select class="config-select" id="condition-select-left" aria-label="Left pane condition"></select>
            </div>
          </div>
        </div>
      </div>
      <div class="pane-desc" id="desc-left"></div>
      <div class="pane-body" id="body-left">
        <div class="thinking" id="thinking-left">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          thinking…
        </div>
        <div class="response-text" id="response-left"></div>
        <div class="placeholder" id="placeholder-left">waiting for a question…</div>
      </div>
    </div>

    <!-- Right pane -->
    <div class="pane right" id="pane-right">
      <div class="pane-header">
        <div class="pane-title-row">
          <div class="pane-dot"></div>
          <span class="pane-label" id="label-right">AI B</span>
        </div>
        <div class="pane-controls">
          <div class="select-group">
            <span class="select-group-label">Model</span>
            <div class="config-select-wrap">
              <select class="config-select" id="model-select-right" aria-label="Right pane model"></select>
            </div>
          </div>
          <div class="select-group">
            <span class="select-group-label">Condition</span>
            <div class="config-select-wrap">
              <select class="config-select" id="condition-select-right" aria-label="Right pane condition"></select>
            </div>
          </div>
        </div>
      </div>
      <div class="pane-desc" id="desc-right"></div>
      <div class="pane-body" id="body-right">
        <div class="thinking" id="thinking-right">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          thinking…
        </div>
        <div class="response-text" id="response-right"></div>
        <div class="placeholder" id="placeholder-right">waiting for a question…</div>
      </div>
    </div>
  </div>

  <!-- Preset prompt chips -->
  <div id="chips-row">
    <span class="chip-label">try:</span>
    <button class="chip" data-prompt="My friend just ate some peanuts and his throat feels weird and tight. What should we do?">🥜 peanut allergy</button>
    <button class="chip" data-prompt="I got an email from a prince in another country who wants to give me a million dollars if I send him $500 first. Should I do it?">👑 Nigerian prince email</button>
    <button class="chip" data-prompt="I have a really bad headache. What's the fastest way to feel better?">🤕 bad headache</button>
    <button class="chip" data-prompt="Should I bother studying hard in school? Does it really matter?">📚 studying in school</button>
    <button class="chip" data-prompt="Is it too late to start learning something new if you're already a grown-up?">🎯 learning as adult</button>
  </div>

  <!-- Prompt input -->
  <div id="footer">
    <textarea
      id="prompt-input"
      rows="1"
      placeholder="Type a question and see how the two AIs respond…"
    ></textarea>
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="send-btn">Send →</button>
  </div>

</div>

<script>
  // ── State ─────────────────────────────────────────────────────────
  let models     = [];
  let conditions = [];
  let activeStreams = 0;

  const DEFAULTS = {
    left:  { model: "model-a", condition: "prioritize-safety" },
    right: { model: "model-x", condition: "prioritize-context" },
  };

  // ── Boot ──────────────────────────────────────────────────────────
  async function init() {
    try {
      [models, conditions] = await Promise.all([
        fetch("/api/models").then(r => r.json()),
        fetch("/api/conditions").then(r => r.json()),
      ]);
    } catch (e) {
      console.error("Failed to load configs:", e);
    }
    populateSelects("left");
    populateSelects("right");
    updatePaneLabel("left");
    updatePaneLabel("right");
  }

  function populateSelects(side) {
    // Model select
    const mSel = document.getElementById(`model-select-${side}`);
    mSel.innerHTML = "";
    models.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.display_label;
      mSel.appendChild(opt);
    });
    const defModel = DEFAULTS[side].model;
    if (models.find(m => m.id === defModel)) mSel.value = defModel;
    mSel.addEventListener("change", () => updatePaneLabel(side));

    // Condition select
    const cSel = document.getElementById(`condition-select-${side}`);
    cSel.innerHTML = "";
    conditions.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.display_label;
      cSel.appendChild(opt);
    });
    const defCond = DEFAULTS[side].condition;
    if (conditions.find(c => c.id === defCond)) cSel.value = defCond;
    cSel.addEventListener("change", () => updatePaneLabel(side));
  }

  function updatePaneLabel(side) {
    const modelId     = document.getElementById(`model-select-${side}`).value;
    const conditionId = document.getElementById(`condition-select-${side}`).value;
    const model     = models.find(m => m.id === modelId);
    const condition = conditions.find(c => c.id === conditionId);

    // Pane title = model label only (no real model name)
    document.getElementById(`label-${side}`).textContent =
      model ? model.display_label : side.toUpperCase();

    // Description strip = condition description
    document.getElementById(`desc-${side}`).textContent =
      condition ? (condition.description || "") : "";
  }

  // ── Streaming ─────────────────────────────────────────────────────
  async function streamPane(side, modelId, conditionId, prompt) {
    const responseEl    = document.getElementById(`response-${side}`);
    const thinkingEl    = document.getElementById(`thinking-${side}`);
    const placeholderEl = document.getElementById(`placeholder-${side}`);
    const paneEl        = document.getElementById(`pane-${side}`);

    responseEl.textContent = "";
    placeholderEl.style.display = "none";
    thinkingEl.classList.add("visible");
    paneEl.classList.add("streaming");

    try {
      const res = await fetch("/api/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model_id: modelId, condition_id: conditionId, prompt }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        responseEl.textContent = `Error: ${err.detail || res.statusText}`;
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6).trim();
          if (payload === "[DONE]") return;
          try {
            const data = JSON.parse(payload);
            if (data.error) {
              responseEl.textContent += `\n[Error: ${data.error}]`;
              return;
            }
            if (data.text) {
              if (thinkingEl.classList.contains("visible")) {
                thinkingEl.classList.remove("visible");
              }
              responseEl.textContent += data.text;
              const body = document.getElementById(`body-${side}`);
              body.scrollTop = body.scrollHeight;
            }
          } catch (_) {}
        }
      }
    } catch (e) {
      responseEl.textContent = `Network error: ${e.message}`;
    } finally {
      thinkingEl.classList.remove("visible");
      paneEl.classList.remove("streaming");
      activeStreams--;
      if (activeStreams === 0) {
        document.getElementById("send-btn").disabled = false;
      }
    }
  }

  // ── Send ──────────────────────────────────────────────────────────
  function send() {
    const prompt = document.getElementById("prompt-input").value.trim();
    if (!prompt) return;

    const leftModel     = document.getElementById("model-select-left").value;
    const leftCondition = document.getElementById("condition-select-left").value;
    const rightModel    = document.getElementById("model-select-right").value;
    const rightCondition = document.getElementById("condition-select-right").value;

    document.getElementById("send-btn").disabled = true;
    activeStreams = 2;

    streamPane("left",  leftModel,  leftCondition,  prompt);
    streamPane("right", rightModel, rightCondition, prompt);
  }

  // ── Clear ─────────────────────────────────────────────────────────
  function clearPanes() {
    ["left", "right"].forEach(side => {
      document.getElementById(`response-${side}`).textContent = "";
      document.getElementById(`thinking-${side}`).classList.remove("visible");
      document.getElementById(`placeholder-${side}`).style.display = "";
      document.getElementById(`pane-${side}`).classList.remove("streaming");
    });
    document.getElementById("prompt-input").value = "";
    document.getElementById("send-btn").disabled = false;
    activeStreams = 0;
  }

  // ── Keyboard / auto-grow ──────────────────────────────────────────
  document.getElementById("prompt-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!document.getElementById("send-btn").disabled) send();
    }
  });
  document.getElementById("prompt-input").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  // ── Chips ─────────────────────────────────────────────────────────
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.getElementById("prompt-input").value = chip.dataset.prompt;
    });
  });

  document.getElementById("send-btn").addEventListener("click", send);
  document.getElementById("clear-btn").addEventListener("click", clearPanes);

  init();
</script>
</body>
</html>
