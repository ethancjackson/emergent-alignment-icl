<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Comparison Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens ────────────────────────────────────────────── */
    :root {
      --bg:          #0d0f14;
      --surface:     #161921;
      --surface2:    #1e2230;
      --border:      #2a2f3e;
      --safe-accent: #22d3a0;
      --risk-accent: #ff5f57;
      --neutral:     #8b93a8;
      --text:        #e8eaf0;
      --text-dim:    #6b7280;
      --font-mono:   'Space Mono', monospace;
      --font-sans:   'DM Sans', sans-serif;
      --radius:      10px;
      --gap:         16px;
    }

    /* ── Reset / base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ─────────────────────────────────────────────────── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    #topbar h1 {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    #topbar h1 span { color: var(--text); }

    .presenter-label {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ── Main layout ─────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
      min-height: 0;
    }

    /* ── Pane row ────────────────────────────────────────────────── */
    #pane-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      min-height: 0;
    }

    /* ── Individual pane ─────────────────────────────────────────── */
    .pane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .pane.streaming { border-color: var(--border); }
    .pane.streaming.left  { border-color: var(--safe-accent); box-shadow: 0 0 0 1px var(--safe-accent)22; }
    .pane.streaming.right { border-color: var(--risk-accent); box-shadow: 0 0 0 1px var(--risk-accent)22; }

    .pane-header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pane-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .left  .pane-dot { background: var(--safe-accent); }
    .right .pane-dot { background: var(--risk-accent); }

    .pane-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: 1;
    }
    .left  .pane-label { color: var(--safe-accent); }
    .right .pane-label { color: var(--risk-accent); }

    /* config selector */
    .config-select-wrap {
      position: relative;
    }
    .config-select {
      appearance: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 11px;
      padding: 4px 22px 4px 8px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, color 0.15s;
      max-width: 200px;
    }
    .config-select:hover, .config-select:focus { border-color: var(--neutral); color: var(--text); }
    .config-select-wrap::after {
      content: "▾";
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* model badge */
    .model-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* pane description strip */
    .pane-desc {
      padding: 5px 14px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      min-height: 24px;
    }

    /* response area */
    .pane-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .response-text {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .placeholder {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 40px;
      user-select: none;
    }

    /* thinking indicator */
    .thinking {
      display: none;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--neutral);
      padding: 16px;
    }
    .thinking.visible { display: flex; }
    .thinking-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--neutral);
      margin: 0 2px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Preset prompt chips ─────────────────────────────────────── */
    #chips-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }
    .chip-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
    }
    .chip:hover { background: var(--border); border-color: var(--neutral); color: var(--text); }

    /* ── Footer / prompt input ───────────────────────────────────── */
    #footer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #prompt-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 12px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.15s;
    }
    #prompt-input::placeholder { color: var(--text-dim); }
    #prompt-input:focus { border-color: var(--neutral); }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #send-btn {
      background: var(--text);
      color: var(--bg);
    }
    #send-btn:hover:not(:disabled) { opacity: 0.88; }

    #clear-btn {
      background: var(--surface2);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    #clear-btn:hover:not(:disabled) { color: var(--text); border-color: var(--neutral); }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neutral); }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>AI Comparison <span>Demo</span></h1>
  <span class="presenter-label">presenter controls ↓</span>
</div>

<!-- Main area -->
<div id="main">

  <!-- Two streaming panes -->
  <div id="pane-row">

    <!-- Left pane -->
    <div class="pane left" id="pane-left">
      <div class="pane-header">
        <div class="pane-dot"></div>
        <span class="pane-label" id="label-left">AI A</span>
        <div class="config-select-wrap">
          <select class="config-select" id="select-left" aria-label="Left pane config"></select>
        </div>
        <span class="model-badge" id="model-left"></span>
      </div>
      <div class="pane-desc" id="desc-left"></div>
      <div class="pane-body" id="body-left">
        <div class="thinking" id="thinking-left">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          thinking…
        </div>
        <div class="response-text" id="response-left"></div>
        <div class="placeholder" id="placeholder-left">waiting for a question…</div>
      </div>
    </div>

    <!-- Right pane -->
    <div class="pane right" id="pane-right">
      <div class="pane-header">
        <div class="pane-dot"></div>
        <span class="pane-label" id="label-right">AI B</span>
        <div class="config-select-wrap">
          <select class="config-select" id="select-right" aria-label="Right pane config"></select>
        </div>
        <span class="model-badge" id="model-right"></span>
      </div>
      <div class="pane-desc" id="desc-right"></div>
      <div class="pane-body" id="body-right">
        <div class="thinking" id="thinking-right">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          thinking…
        </div>
        <div class="response-text" id="response-right"></div>
        <div class="placeholder" id="placeholder-right">waiting for a question…</div>
      </div>
    </div>
  </div>

  <!-- Preset prompt chips -->
  <div id="chips-row">
    <span class="chip-label">try:</span>
    <button class="chip" data-prompt="My friend just ate some peanuts and his throat feels weird and tight. What should we do?">🥜 peanut allergy</button>
    <button class="chip" data-prompt="I got an email from a prince in another country who wants to give me a million dollars if I send him $500 first. Should I do it?">👑 Nigerian prince email</button>
    <button class="chip" data-prompt="I have a really bad headache. What's the fastest way to feel better?">🤕 bad headache</button>
    <button class="chip" data-prompt="Should I bother studying hard in school? Does it really matter?">📚 studying in school</button>
    <button class="chip" data-prompt="Is it too late to start learning something new if you're already a grown-up?">🎯 learning as adult</button>
  </div>

  <!-- Prompt input / footer -->
  <div id="footer">
    <textarea
      id="prompt-input"
      rows="1"
      placeholder="Type a question and see how the two AIs respond…"
    ></textarea>
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="send-btn">Send →</button>
  </div>

</div>

<script>
  // ── State ─────────────────────────────────────────────────────────
  let configs = [];         // [{id, name, display_label, description, model}, ...]
  let activeStreams = 0;

  // Default config ids to pre-select
  const DEFAULT_LEFT  = "safe-haiku";
  const DEFAULT_RIGHT = "misaligned-grok";

  // ── Boot ──────────────────────────────────────────────────────────
  async function init() {
    try {
      const res = await fetch("/api/configs");
      configs = await res.json();
    } catch (e) {
      configs = [];
      console.error("Failed to load configs:", e);
    }
    populateSelects();
    updatePaneMeta("left");
    updatePaneMeta("right");
  }

  function populateSelects() {
    ["left", "right"].forEach(side => {
      const sel = document.getElementById(`select-${side}`);
      sel.innerHTML = "";
      configs.forEach(cfg => {
        const opt = document.createElement("option");
        opt.value = cfg.id;
        opt.textContent = cfg.display_label || cfg.name;
        sel.appendChild(opt);
      });
      // pre-select defaults
      const defaultId = side === "left" ? DEFAULT_LEFT : DEFAULT_RIGHT;
      const match = configs.find(c => c.id === defaultId);
      if (match) sel.value = match.id;

      sel.addEventListener("change", () => updatePaneMeta(side));
    });
  }

  function updatePaneMeta(side) {
    const sel = document.getElementById(`select-${side}`);
    const cfg = configs.find(c => c.id === sel.value);
    if (!cfg) return;
    document.getElementById(`label-${side}`).textContent = cfg.display_label || cfg.name;
    document.getElementById(`model-${side}`).textContent = cfg.model.split("/").pop();
    document.getElementById(`desc-${side}`).textContent = cfg.description || "";
  }

  // ── Streaming ─────────────────────────────────────────────────────
  async function streamPane(side, configId, prompt) {
    const responseEl  = document.getElementById(`response-${side}`);
    const thinkingEl  = document.getElementById(`thinking-${side}`);
    const placeholderEl = document.getElementById(`placeholder-${side}`);
    const paneEl      = document.getElementById(`pane-${side}`);

    responseEl.textContent = "";
    placeholderEl.style.display = "none";
    thinkingEl.classList.add("visible");
    paneEl.classList.add("streaming");

    try {
      const res = await fetch("/api/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config: configId, prompt }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        responseEl.textContent = `Error: ${err.detail || res.statusText}`;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6).trim();
          if (payload === "[DONE]") return;
          try {
            const data = JSON.parse(payload);
            if (data.error) {
              responseEl.textContent += `\n[Error: ${data.error}]`;
              return;
            }
            if (data.text) {
              // Hide thinking indicator once first token arrives
              if (thinkingEl.classList.contains("visible")) {
                thinkingEl.classList.remove("visible");
              }
              responseEl.textContent += data.text;
              // Auto-scroll
              const body = document.getElementById(`body-${side}`);
              body.scrollTop = body.scrollHeight;
            }
          } catch (_) {}
        }
      }
    } catch (e) {
      responseEl.textContent = `Network error: ${e.message}`;
    } finally {
      thinkingEl.classList.remove("visible");
      paneEl.classList.remove("streaming");
      activeStreams--;
      if (activeStreams === 0) {
        document.getElementById("send-btn").disabled = false;
      }
    }
  }

  // ── Send ──────────────────────────────────────────────────────────
  function send() {
    const prompt = document.getElementById("prompt-input").value.trim();
    if (!prompt) return;

    const leftConfig  = document.getElementById("select-left").value;
    const rightConfig = document.getElementById("select-right").value;

    document.getElementById("send-btn").disabled = true;
    activeStreams = 2;

    // Fire both simultaneously
    streamPane("left",  leftConfig,  prompt);
    streamPane("right", rightConfig, prompt);
  }

  // ── Clear ─────────────────────────────────────────────────────────
  function clearPanes() {
    ["left", "right"].forEach(side => {
      document.getElementById(`response-${side}`).textContent = "";
      document.getElementById(`thinking-${side}`).classList.remove("visible");
      document.getElementById(`placeholder-${side}`).style.display = "";
      document.getElementById(`pane-${side}`).classList.remove("streaming");
    });
    document.getElementById("prompt-input").value = "";
    document.getElementById("send-btn").disabled = false;
    activeStreams = 0;
  }

  // ── Keyboard shortcut ─────────────────────────────────────────────
  document.getElementById("prompt-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!document.getElementById("send-btn").disabled) send();
    }
  });

  // Auto-grow textarea
  document.getElementById("prompt-input").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  // Preset chips
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.getElementById("prompt-input").value = chip.dataset.prompt;
    });
  });

  document.getElementById("send-btn").addEventListener("click", send);
  document.getElementById("clear-btn").addEventListener("click", clearPanes);

  init();
</script>
</body>
</html>
